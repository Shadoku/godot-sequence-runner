name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version') }}

      - name: Install Godot
        run: bash tools/install_godot.sh

      - name: Run the full check
        run: python3 tools/check.py --fresh
